# Configuracao dos testes.
#
# Este arquivo esta no classpath de teste e substitui o application.properties de
# main, entao a suite nao ativa o perfil local, nao procura credenciais reais e nao
# depende de um PostgreSQL acessivel. Era isso que impedia o unico teste existente de
# rodar em qualquer maquina que nao fosse a de desenvolvimento — e a razao de o build
# da imagem passar -DskipTests.
spring.application.name=brazil-test

spring.datasource.url=jdbc:h2:mem:pescabrasil;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Valores fixos e sem significado fora do teste.
jwt.secret=chave-de-teste-com-mais-de-32-caracteres-para-hs256
google.recaptcha.secret=segredo-de-teste
cloudinary.cloud-name=teste
cloudinary.api-key=teste
cloudinary.api-secret=teste
spring.mail.username=teste@example.com
spring.mail.password=teste

# O rate limit tem estado proprio e janela real: ligado, ele tornaria a ordem dos
# testes relevante. Os testes que importam para ele o ligam explicitamente.
pescabrasil.rate-limit.enabled=false
pescabrasil.openapi.public=true

# MailSenderAutoConfiguration so cria o JavaMailSender quando ha um host. Sem esta
# linha o contexto nao sobe, porque o EmailService depende dele. Nada e enviado: os
# testes de servico usam um mock, e nenhum teste chama o envio de verdade.
spring.mail.host=localhost
spring.mail.port=3025
