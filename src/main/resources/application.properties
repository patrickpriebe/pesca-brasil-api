spring.application.name=brazil

spring.profiles.active=local

# ==========================================
# PERSISTENCIA
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# SQL no console e util no desenvolvimento e ruido em producao: o perfil local liga.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# O pooler do Supabase entrega uma sessao diferente por transacao, e um prepared
# statement vive numa sessao. Sem prepareThreshold=0 na URL, consultas falham de forma
# intermitente com "prepared statement already exists" sob qualquer concorrencia.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ==========================================
# E-MAIL
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# UPLOAD
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================================
# PROXY
# ==========================================
# Atras do proxy do Render, getRemoteAddr() devolveria o endereco do proxy para todo
# mundo. Com a estrategia ligada o Spring reescreve a requisicao a partir de
# X-Forwarded-For, que e do que o rate limit por origem depende para nao tratar a base
# inteira como um unico cliente.
server.forward-headers-strategy=framework

# ==========================================
# RATE LIMIT (janela fixa sobre /api/auth/**)
# ==========================================
pescabrasil.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
pescabrasil.rate-limit.requests-per-window=${RATE_LIMIT_REQUESTS:20}
pescabrasil.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# ==========================================
# CORS E DOCUMENTACAO
# ==========================================
pescabrasil.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://pescabrasil.vercel.app}
pescabrasil.openapi.public=${OPENAPI_PUBLIC:false}

# ==========================================
# OBSERVABILIDADE
# ==========================================
# Apenas health, e sem detalhe: a plataforma precisa da sonda, e ninguem mais precisa
# saber quais componentes existem nem em que estado estao.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ==========================================
# VARIAVEIS DE AMBIENTE
# ==========================================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}

google.recaptcha.secret=${RECAPTCHA_SECRET:}

# Sem valor padrao de proposito: um ambiente sem JWT_SECRET precisa falhar na
# inicializacao, e nao assinar tokens com uma chave publicada no repositorio.
jwt.secret=${JWT_SECRET}
